# OddSea on GitHub: runs the model here, so it works with the PC off.
#   every 2 hours       full model run (fresh DraftKings + Kalshi prices, new picks)
#   every 30 minutes    scores, grading and results (skipped while no game is live or waiting for a result);
#                       a full model run instead when a game kicks off within 3 hours (lineups, inactives, prices)
#   any time            the Run button on the phone page or in the PC app, or Actions > OddSea > Run workflow
# The data travels between runs as a file on the "oddsea-data" release; each run publishes the page to GitHub Pages.
name: OddSea

on:
  workflow_dispatch:
    inputs:
      kind:
        description: What to run
        type: choice
        options: [run, scores, history]
        default: run
  schedule:
    - cron: "7 */2 * * *"      # model run (this exact text is matched below)
    - cron: "7 1-23/2 * * *"   # scores, between model runs
    - cron: "37 * * * *"       # scores

permissions:
  contents: write              # save the data file on the release (and a rare keep-alive commit)
  pages: write                 # publish the page
  id-token: write              # (required by the Pages publish step)

concurrency:
  group: oddsea                # one run at a time; a new one waits for the current one
  cancel-in-progress: false

env:
  TZ: America/New_York
  PYTHONUNBUFFERED: "1"
  BETMODEL_NO_PUBLISH: "1"

jobs:
  update:
    name: Update OddSea
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      deploy: ${{ steps.model.outputs.deploy }}
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Decide what to run
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          KIND: ${{ inputs.kind || (github.event.schedule == '7 */2 * * *' && 'run') || 'scores' }}
        run: python3 -m betmodel.cloud plan --kind "$KIND" --event "$EVENT"

      - name: Set up Python
        id: py
        if: steps.plan.outputs.go == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # the installed packages are kept between runs (rebuilt only when Python or requirements-cloud.txt change)
      - name: Restore the Python packages
        id: venv
        if: steps.plan.outputs.go == 'true'
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.py.outputs.python-version }}-${{ hashFiles('requirements-cloud.txt') }}

      - name: Install packages
        if: steps.plan.outputs.go == 'true' && steps.venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements-cloud.txt

      - name: Use the packages
        if: steps.plan.outputs.go == 'true'
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      # the newest saved copy of the downloaded NFL / soccer files (saved again below whenever one was re-downloaded)
      - name: Restore the NFL and soccer files
        if: steps.plan.outputs.go == 'true'
        uses: actions/cache/restore@v6
        with:
          path: |
            data/nfl
            data/soccer
          key: oddsea-files-${{ github.run_id }}
          restore-keys: oddsea-files-

      - name: Run the model
        if: steps.plan.outputs.go == 'true'
        id: model
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m betmodel.cloud job "${{ steps.plan.outputs.kind }}"

      - name: Upload the page
        if: steps.model.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: snapshot

      - name: Save the NFL and soccer files
        if: steps.model.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            data/nfl
            data/soccer
          key: oddsea-files-${{ hashFiles('data/nfl/**', 'data/soccer/**') }}

  deploy:
    name: Publish
    needs: update
    if: needs.update.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Publish the page
        id: pages
        uses: actions/deploy-pages@v5
        with:
          reporting_interval: 2000   # check every 2 s whether the page is live (default 5 s)
